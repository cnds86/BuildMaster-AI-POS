version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mhx-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mhxpos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mhxpos_secret}
      POSTGRES_DB: mhxpos_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhxpos -d mhxpos_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: mhx-pos-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://mhxpos:${DB_PASSWORD:-mhxpos_secret}@postgres:5432/mhxpos_prod
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
