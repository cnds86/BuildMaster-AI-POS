
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAHAXAY AI POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Lao:wght@100..900&family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans Thai', 'Noto Sans Lao', 'sans-serif'],
              thai: ['Noto Sans Thai', 'sans-serif'],
              lao: ['Noto Sans Lao', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#fef2f2',
                100: '#fee2e2',
                200: '#fecaca',
                300: '#fca5a5',
                400: '#f87171',
                500: '#ef4444',
                600: '#dc2626', // Main Brand Red
                700: '#b91c1c',
                800: '#991b1b',
                900: '#7f1d1d',
              },
              construction: {
                orange: '#dc2626', 
                yellow: '#fbbf24', 
                concrete: '#64748b', 
                dark: '#0f172a'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', 'Noto Sans Thai', 'Noto Sans Lao', sans-serif;
        background-color: #f8fafc;
      }
      /* Custom scrollbar for table/lists */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Scanner Animation */
      @keyframes scan {
        0%, 100% { top: 0%; }
        50% { top: 100%; }
      }
      .animate-scan {
        animation: scan 2s linear infinite;
      }

      /* --- Advanced Thermal Print Styles --- */
      @media print {
        @page {
          margin: 0;
          size: auto;
        }
        
        body {
          margin: 0;
          padding: 0;
          background: white;
        }

        /* Hide EVERYTHING by default */
        body * {
          visibility: hidden;
          height: 0;
          overflow: hidden;
        }

        /* Only show the targeted print area */
        #printable-receipt, #printable-receipt * {
          visibility: visible;
          height: auto;
          overflow: visible;
        }
        
        #printable-labels, #printable-labels * {
          visibility: visible;
          height: auto;
          overflow: visible;
        }

        /* Receipt Positioning */
        #printable-receipt {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          padding: 10px 0; /* Minimal padding for thermal paper */
          margin: 0;
          background: white;
          color: black !important;
          border: none !important;
          box-shadow: none !important;
        }

        /* Label Positioning */
        #printable-labels {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 10mm;
          background: white;
          color: black !important;
          display: grid !important; /* Force grid layout for stickers */
        }

        /* Specific fix for thermal width classes dynamically applied by React */
        .print-w-58mm {
          width: 58mm !important;
          font-size: 10px !important;
        }
        .print-w-80mm {
          width: 80mm !important;
          font-size: 12px !important;
        }
        .print-w-A4 {
          width: 210mm !important;
          font-size: 12pt !important;
          padding: 20mm !important;
        }

        /* Ensure images/QR print correctly */
        img {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "tailwind-merge": "https://esm.sh/tailwind-merge@^3.4.0",

    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "zod": "https://esm.sh/zod@^4.3.5",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@prisma/client": "https://esm.sh/@prisma/client@^7.2.0",
    "bcryptjs": "https://esm.sh/bcryptjs@^3.0.3",

    "zustand": "https://esm.sh/zustand@^5.0.9"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
