
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildMaster AI POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Lao:wght@100..900&family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans Thai', 'Noto Sans Lao', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                900: '#0c4a6e',
              },
              construction: {
                orange: '#f97316',
                yellow: '#eab308',
                concrete: '#64748b',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', 'Noto Sans Thai', 'Noto Sans Lao', sans-serif;
        background-color: #f8fafc;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }
      .animate-scan { animation: scan 2s linear infinite; }
      @media print {
        @page { margin: 0; size: auto; }
        body * { visibility: hidden; height: 0; overflow: hidden; }
        #printable-receipt, #printable-receipt * { visibility: visible; height: auto; overflow: visible; }
        #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
      }
    </style>
