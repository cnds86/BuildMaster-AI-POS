# ============================================================
# MHX-POS Frontend nginx config
# SPA routing + /api proxy to backend + /ws WebSocket proxy
# ============================================================

# PORT is set via docker-compose environment and exposed via env declaration
# Hardcoded fallback matches docker-compose default
env PORT;

server {
    # PORT from docker-compose env (falls back to 5173 if unset)
    listen 5173;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root directory (built Vite output)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # ── /api proxy to backend service ────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── WebSocket proxy ────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Static assets — cache aggressively ──────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── HTML — no cache ───────────────────────────────────────────────────────
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── SPA fallback — all routes serve index.html ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health check endpoint ────────────────────────────────────────────────
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
    }
}
